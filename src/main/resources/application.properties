spring.application.name=dtospringboot
logging.pattern.console=%green(%d{HH:mm:ss.SSS}) %blue(%5level) %red([%thread]) %yellow(%logger{36}) - %msg%n

server.port=7777

spring.ai.openai.api-key=${OPENAI_API_KEY}


spring.ai.ollama.chat.model=llama3:latest

spring.ai.chat.client.enabled=false



# MySQL Database Connection Settings

# URL connecting to your 'springboot' database schema
spring.datasource.url=jdbc:mysql://localhost:3306/koyel
# Database credentials
spring.datasource.username=root
spring.datasource.password=root

# MySQL JDBC Driver (Automatically detected in modern Spring Boot versions, but good for explicit configuration)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# JPA / Hibernate Configurations
# SQL Dialect optimized for modern MySQL databases
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Database management policies:
# update: Updates the schema if structures change (safe for development)
# create: Re-creates the database tables every time the application starts
# create-drop: Creates the schema at startup and drops it when the application stops
spring.jpa.hibernate.ddl-auto=create

# Logging and formatting SQL statements in the console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true



